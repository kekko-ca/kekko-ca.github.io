<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>kekko card</title>
<style>
  :root { color-scheme: light; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "Hiragino Sans", "Noto Sans", sans-serif;
         background:#f4f1ea; color:#111; padding:20px 16px 40px; }
  .card { max-width:560px; margin:0 auto; background:#fff; border-radius:16px;
          padding:24px 20px; box-shadow:0 4px 18px rgba(0,0,0,.08); }
  h1 { font-size:26px; margin-bottom:14px; }
  .line { font-size:19px; font-weight:600; margin:7px 0; line-height:1.35; }
  .allergy { color:#c81e1e; font-weight:800; }
  .header { font-size:12px; letter-spacing:.06em; color:#8a8a8f; font-weight:700;
            text-transform:uppercase; margin:16px 0 2px; }
  .note { font-size:17px; font-weight:500; margin:10px 0; line-height:1.4; }
  .brand { margin-top:22px; font-size:13px; font-weight:800; color:#2c5440; }
  .err { color:#c81e1e; font-size:16px; line-height:1.5; }
</style>
</head>
<body>
<div class="card" id="card"><p class="err" id="msg">Loading…</p></div>
<script>
(async function () {
  const card = document.getElementById('card');
  const fail = (m) => { card.innerHTML = '<p class="err">' + m + '</p>'; };
  try {
    const frag = location.hash.slice(1);
    if (!frag) return fail('No card data in this link.');
    // base64url -> bytes
    const b64 = frag.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    // raw-deflate decompress
    if (!('DecompressionStream' in window)) return fail('This browser is too old to show the card.');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    const text = await new Response(stream).text();

    // Render: first non-empty line = name; [X] = section header;
    // lines starting with the warning sign = allergy; bullet lines = items.
    const lines = text.split('\n');
    let html = '';
    let nameDone = false;
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) continue;
      if (!nameDone) { html += '<h1>' + esc(line) + '</h1>'; nameDone = true; continue; }
      if (line === '— kekko' || line === '— Kekko') { html += '<div class="brand">kekko</div>'; continue; }
      const m = line.match(/^\[(.+)\]$/);
      if (m) { html += '<div class="header">' + esc(m[1]) + '</div>'; continue; }
      if (line.startsWith('⚠')) {
        html += '<div class="line allergy">' + esc(line.replace(/^⚠\s*/, '⚠ ')) + '</div>';
      } else if (line.startsWith('•')) {
        html += '<div class="line">' + esc(line.replace(/^•\s*/, '')) + '</div>';
      } else {
        html += '<div class="note">' + esc(line) + '</div>';
      }
    }
    card.innerHTML = html || '<p class="err">Empty card.</p>';
  } catch (e) {
    fail('Could not read the card data.');
  }
  function esc(s) {
    return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }
})();
</script>
</body>
</html>
