<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kekko — Eat anywhere. Explain nothing.</title>
<meta name="description" content="kekko shows restaurants your dietary needs in their language. Allergies, restrictions, and drink orders, translated into 16 languages.">
<link rel="icon" type="image/png" sizes="64x64" href="kekko-mark-64.png">
<link rel="apple-touch-icon" href="kekko-mark-180.png">
<style>
  :root { color-scheme: light dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "Inter", "Hiragino Sans", sans-serif;
         min-height:100svh; display:flex; align-items:center; justify-content:center;
         background:#faf8f3; color:#2b2a26; padding:24px 16px; text-align:center; }
  @media (prefers-color-scheme: dark) { body { background:#16231c; color:#f4f0e5; } }
  main { max-width:560px; }
  .logo { height:72px; margin-bottom:28px; }
  h1 { font-size:28px; font-weight:700; letter-spacing:-0.01em; margin-bottom:12px; }
  p { font-size:17px; line-height:1.55; color:#6d6a60; }
  @media (prefers-color-scheme: dark) { p { color:#b9c4bc; } }
  .soon { display:inline-block; margin-top:26px; font-size:14px; font-weight:600;
          letter-spacing:.06em; text-transform:uppercase; color:#2c5440;
          border:1.5px solid #2c5440; border-radius:999px; padding:8px 18px; }
  @media (prefers-color-scheme: dark) { .soon { color:#8cc29e; border-color:#8cc29e; } }
  footer { margin-top:40px; font-size:13px; color:#9a968a; }
  footer a { color:inherit; }
</style>
</head>
<body>
<main>
  <picture>
    <source srcset="kekko-logo-dark.svg" media="(prefers-color-scheme: dark)">
    <img class="logo" src="kekko-logo.svg" alt="kekko">
  </picture>
  <h1>Eat anywhere. Explain nothing.</h1>
  <p>kekko shows restaurants your dietary needs in their language — allergies, restrictions, and your exact drink order, translated into 16 languages and shared in one tap.</p>
  <div class="soon">Coming soon to the App Store</div>
  <footer><a href="mailto:support@kekko.ca">support@kekko.ca</a></footer>
</main>
</body>
</html>
